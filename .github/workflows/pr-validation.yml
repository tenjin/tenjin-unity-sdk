name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  package-consistency:
    name: Package consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate package consistency
        run: python .github/scripts/validate-package.py
