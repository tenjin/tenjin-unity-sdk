name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version from RELEASE_NOTES.md
        id: version
        run: |
          RAW_LINE=$(grep -m1 -E '^(## \[[0-9]+\.[0-9]+\.[0-9]+\]|v[0-9]+\.[0-9]+\.[0-9]+$)' RELEASE_NOTES.md | tr -d '\r')
          if [[ -z "$RAW_LINE" ]]; then
            echo "::error::Could not detect version from RELEASE_NOTES.md"
            exit 1
          fi
          VERSION=$(echo "$RAW_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [[ "$RAW_LINE" == "##"* ]]; then
            FORMAT="header"
          else
            FORMAT="legacy"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "format=$FORMAT" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.version }} already exists; skipping release."
            exit 1
          fi

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FORMAT="${{ steps.version.outputs.format }}"
          if [[ "$FORMAT" == "header" ]]; then
            NOTES=$(awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 {found=1; next}
              found && /^## \[/ {exit}
              found && /^\* /{print}
            ' RELEASE_NOTES.md | sed 's/ \[TENJIN-[0-9]*\]//g')
          else
            NOTES=$(awk "/^v${VERSION}\$/{found=1; next} /^----\$/{if(found) {capture=1; next}} /^v[0-9]/{if(capture) exit} capture && /^[*-] /{print}" RELEASE_NOTES.md | sed 's/ \[TENJIN-[0-9]*\]//g')
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: Legacy~/TenjinUnityPackage.unitypackage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
